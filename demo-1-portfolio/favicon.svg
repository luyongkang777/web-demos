<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 标志寓意「小满」：一个盛了大半的圆，小得盈满 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <clipPath id="c"><circle cx="32" cy="32" r="15"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#fff" stroke-width="4"/>
  <rect x="10" y="35" width="44" height="20" fill="#fff" clip-path="url(#c)"/>
</svg>
