<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 作品封面 1：轻记 · 记账 App（替换为真实作品截图即可，建议 4:3） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#6ee7b7"/></linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#064e3b" flood-opacity=".45"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="680" cy="70" r="190" fill="#fff" opacity=".08"/>
  <circle cx="90" cy="560" r="220" fill="#fff" opacity=".06"/>
  <text x="48" y="78" font-size="22" font-weight="700" fill="#fff" opacity=".9">轻记</text>
  <text x="48" y="104" font-size="13" fill="#fff" opacity=".7" letter-spacing="2">EASY LEDGER · 2.0</text>

  <!-- 手机 1 -->
  <g transform="translate(196 92)" filter="url(#sh)">
    <rect width="212" height="440" rx="36" fill="#0f172a"/>
    <rect x="8" y="8" width="196" height="424" rx="29" fill="#f8fafc"/>
    <rect x="78" y="18" width="56" height="14" rx="7" fill="#0f172a"/>
    <text x="26" y="70" font-size="11" fill="#64748b">本月支出 · 10 月</text>
    <text x="26" y="100" font-size="27" font-weight="700" fill="#0f172a">¥3,286<tspan font-size="16">.50</tspan></text>
    <g transform="translate(106 176) rotate(-90)" fill="none" stroke-width="15">
      <circle r="46" stroke="#e2e8f0"/>
      <circle r="46" stroke="#10b981" stroke-dasharray="118 300"/>
      <circle r="46" stroke="#f59e0b" stroke-dasharray="0 122 70 300"/>
      <circle r="46" stroke="#6366f1" stroke-dasharray="0 196 44 300"/>
    </g>
    <text x="106" y="172" font-size="10" fill="#64748b" text-anchor="middle">预算剩余</text>
    <text x="106" y="190" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">62%</text>
    <g font-size="11.5">
      <circle cx="40" cy="262" r="13" fill="#d1fae5"/><circle cx="40" cy="262" r="5" fill="#10b981"/>
      <text x="62" y="266" fill="#0f172a">餐饮美食</text><text x="186" y="266" fill="#0f172a" text-anchor="end" font-weight="600">-¥1,240</text>
      <circle cx="40" cy="306" r="13" fill="#fef3c7"/><circle cx="40" cy="306" r="5" fill="#f59e0b"/>
      <text x="62" y="310" fill="#0f172a">交通出行</text><text x="186" y="310" fill="#0f172a" text-anchor="end" font-weight="600">-¥386</text>
      <circle cx="40" cy="350" r="13" fill="#e0e7ff"/><circle cx="40" cy="350" r="5" fill="#6366f1"/>
      <text x="62" y="354" fill="#0f172a">学习提升</text><text x="186" y="354" fill="#0f172a" text-anchor="end" font-weight="600">-¥520</text>
    </g>
    <circle cx="106" cy="400" r="21" fill="#10b981"/>
    <path d="M106 391v18M97 400h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 手机 2 -->
  <g transform="translate(436 52)" filter="url(#sh)">
    <rect width="212" height="440" rx="36" fill="#0f172a"/>
    <rect x="8" y="8" width="196" height="424" rx="29" fill="#ffffff"/>
    <rect x="78" y="18" width="56" height="14" rx="7" fill="#0f172a"/>
    <text x="26" y="70" font-size="11" fill="#64748b">本周报告</text>
    <text x="26" y="98" font-size="20" font-weight="700" fill="#0f172a">比上周省了 ¥268</text>
    <g fill="url(#bar)">
      <rect x="28" y="190" width="16" height="70" rx="8"/>
      <rect x="51" y="160" width="16" height="100" rx="8"/>
      <rect x="74" y="200" width="16" height="60" rx="8"/>
      <rect x="97" y="140" width="16" height="120" rx="8" fill="#047857"/>
      <rect x="120" y="176" width="16" height="84" rx="8"/>
      <rect x="143" y="210" width="16" height="50" rx="8"/>
      <rect x="166" y="186" width="16" height="74" rx="8"/>
    </g>
    <g font-size="9" fill="#94a3b8" text-anchor="middle">
      <text x="36" y="278">一</text><text x="59" y="278">二</text><text x="82" y="278">三</text><text x="105" y="278">四</text><text x="128" y="278">五</text><text x="151" y="278">六</text><text x="174" y="278">日</text>
    </g>
    <rect x="22" y="300" width="168" height="62" rx="16" fill="#ecfdf5"/>
    <text x="38" y="326" font-size="11" fill="#047857" font-weight="600">智能提示</text>
    <text x="38" y="346" font-size="10.5" fill="#065f46">周四外卖偏多，试试带饭？</text>
    <rect x="22" y="376" width="168" height="40" rx="20" fill="#0f172a"/>
    <text x="106" y="401" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">查看月度报告</text>
  </g>
</svg>
