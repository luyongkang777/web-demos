    <path d="M166 300 C196 290 206 250 236 256 S286 220 316 230 S366 190 396 196 S436 168 452 172" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    <path d="M166 312 C206 306 236 290 276 292 S346 270 396 262 S440 250 452 248" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="396" cy="196" r="6" fill="#fff" stroke="#6366f1" stroke-width="3"/>
    <rect x="358" y="160" width="76" height="24" rx="6" fill="#1e1b4b"/>
    <text x="396" y="176" font-size="10" fill="#fff" text-anchor="middle">¥42,380</text>
