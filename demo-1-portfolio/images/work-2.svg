      <text x="164" y="74" fill="#64748b">本月销售额</text><text x="164" y="100" font-size="20" font-weight="700" fill="#0f172a">¥1.28M</text><text x="164" y="116" fill="#10b981">▲ 12.4%</text>
      <rect x="314" y="52" width="152" height="74" rx="12" fill="#fff" stroke="#e2e8f0"/>
      <text x="328" y="74" fill="#64748b">活跃门店</text><text x="328" y="100" font-size="20" font-weight="700" fill="#0f172a">326</text><text x="328" y="116" fill="#10b981">▲ 8 家</text>
