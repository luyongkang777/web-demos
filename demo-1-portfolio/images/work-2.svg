      <circle r="42" stroke="#4f46e5" stroke-dasharray="110 300"/>
      <circle r="42" stroke="#a5b4fc" stroke-dasharray="0 114 62 300"/>
      <circle r="42" stroke="#f59e0b" stroke-dasharray="0 180 40 300"/>
    </g>
    <text x="561" y="241" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">42%</text>
    <g font-size="9" fill="#64748b"><circle cx="500" cy="312" r="4" fill="#4f46e5"/><text x="508" y="315">饮品</text><circle cx="546" cy="312" r="4" fill="#a5b4fc"/><text x="554" y="315">零食</text><circle cx="592" cy="312" r="4" fill="#f59e0b"/><text x="600" y="315">日用</text></g>
