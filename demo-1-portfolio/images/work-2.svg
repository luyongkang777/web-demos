      <rect x="28" y="113" width="8" height="8" rx="2" opacity=".4"/><rect x="44" y="114" width="44" height="6" rx="3" opacity=".4"/>
      <rect x="28" y="145" width="8" height="8" rx="2" opacity=".4"/><rect x="44" y="146" width="56" height="6" rx="3" opacity=".4"/>
      <rect x="28" y="177" width="8" height="8" rx="2" opacity=".4"/><rect x="44" y="178" width="40" height="6" rx="3" opacity=".4"/>
      <rect x="28" y="209" width="8" height="8" rx="2" opacity=".4"/><rect x="44" y="210" width="50" height="6" rx="3" opacity=".4"/>
    </g>
