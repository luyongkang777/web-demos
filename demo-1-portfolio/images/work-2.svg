    <g fill="#cbd5e1"><rect x="166" y="366" width="90" height="7" rx="3.5"/><rect x="300" y="366" width="60" height="7" rx="3.5"/><rect x="420" y="366" width="70" height="7" rx="3.5"/></g>
    <g fill="#e2e8f0"><rect x="166" y="392" width="120" height="7" rx="3.5"/><rect x="300" y="392" width="44" height="7" rx="3.5"/><rect x="420" y="392" width="80" height="7" rx="3.5"/></g>
    <rect x="566" y="362" width="60" height="16" rx="8" fill="#dcfce7"/><text x="596" y="374" font-size="9" fill="#15803d" text-anchor="middle">正常</text>
    <rect x="566" y="388" width="60" height="16" rx="8" fill="#fee2e2"/><text x="596" y="400" font-size="9" fill="#b91c1c" text-anchor="middle">预警</text>
